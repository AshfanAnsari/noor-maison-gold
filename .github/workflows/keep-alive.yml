# Keep-alive for Saba's Supabase project (free tier pauses after ~7
# idle days; one tiny read every 3 days resets that clock).
# The anon key is public by design — Row Level Security is what
# protects the data, not this key.
name: keep-alive

on:
  schedule:
    - cron: '17 3 */3 * *'   # every 3 days, 03:17 UTC
  workflow_dispatch:          # allow a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: One small read from the products table
        run: |
          curl -sf \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5c3JhY2V0ZWRia2pmcHNpemFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU3NzIzOTUsImV4cCI6MjExMTM0ODM5NX0._r5U_dDLzlI161_NYlrsNlLEdDKoI8i1exlBeHguHe4" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5c3JhY2V0ZWRia2pmcHNpemFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU3NzIzOTUsImV4cCI6MjExMTM0ODM5NX0._r5U_dDLzlI161_NYlrsNlLEdDKoI8i1exlBeHguHe4" \
            "https://iysracetedbkjfpsizah.supabase.co/rest/v1/products?select=id&limit=1" \
            > /dev/null
          echo "Supabase is awake."
